# docker-compose.dev.yml
# Development override with hot-reload

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: agentic-ai-trading-app-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentic_ai_trading?schema=public
      BETTER_AUTH_SECRET: dev-secret-key-change-in-production-min-32-chars
      BETTER_AUTH_URL: http://localhost:5173
      PUBLIC_APP_NAME: Agentic AI Trading
      PUBLIC_APP_URL: http://localhost:5173
      PORT: 5173
    ports:
      - "5173:5173"
      - "24678:24678" # Vite HMR port
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.svelte-kit
      - /app/build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentic-network
    command: npm run dev -- --host 0.0.0.0 --port 5173