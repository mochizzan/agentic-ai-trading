# docker-compose.yml
# Docker Compose for local development and production

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: agentic-ai-trading-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic_ai_trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-network

  # Redis for caching/sessions (optional)
  redis:
    image: redis:7-alpine
    container_name: agentic-ai-trading-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-ai-trading-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentic_ai_trading?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      PUBLIC_APP_NAME: ${PUBLIC_APP_NAME:-Agentic AI Trading}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      PORT: 5173
    ports:
      - "5173:5173"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentic-network
    restart: unless-stopped

  # Development override (use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up)
  # See docker-compose.dev.yml for hot-reload development setup

volumes:
  postgres_data:
  redis_data:

networks:
  agentic-network:
    driver: bridge